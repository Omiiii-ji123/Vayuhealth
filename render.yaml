services:
  - type: web
    name: vayuhealth-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: WAQI_API_TOKEN
        sync: false

  - type: web
    name: vayuhealth-web
    runtime: static
    rootDir: vayuhealth
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: https://vayuhealth-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
