spring.application.name=Backend
server.port=${PORT:8081}
server.address=0.0.0.0

# MongoDB Connection Configuration (Supports SPRING_DATA_MONGODB_URI and MONGODB_URI)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/vayuhealth_cpcb}}
spring.mongodb.uri=${spring.data.mongodb.uri}
spring.data.mongodb.auto-index-creation=false

# Actuator Health & Diagnostics
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info

# Real-time AQI configuration
# Register for a token at https://aqicn.org/data-platform/token/
aqi.waqi.token=${WAQI_API_TOKEN:}
aqi.waqi.base-url=https://api.waqi.info

# NASA FIRMS Active Fire Telemetry
# Register free MAP_KEY at https://firms.modaps.eosdis.nasa.gov/api/map_key/
nasa.firms.map-key=${NASA_FIRMS_MAP_KEY:}
nasa.firms.base-url=https://firms.modaps.eosdis.nasa.gov/api
